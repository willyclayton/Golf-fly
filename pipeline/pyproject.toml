[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golffly"
version = "0.1.0"
description = "Offline course pipeline for the 3D yardage book: OpenStreetMap + lidar to static course packages."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "shapely>=2.0",
  "rasterio>=1.3.9",
  "pyproj>=3.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
golffly = "golffly.cli:main"

[tool.setuptools.packages.find]
include = ["golffly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
