name: CI

on:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "pipeline/**"

permissions:
  contents: read

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest -q
