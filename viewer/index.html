<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7fb2e0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Golf Fly · course preview</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%236fa34a'/><path d='M14 6v20' stroke='white' stroke-width='2'/><path d='M14 6l9 4-9 4z' fill='%23e8413b'/></svg>"
    />
  </head>
  <body>
    <div id="view"></div>

    <header class="pill">
      <button id="prev" class="icon" aria-label="Previous hole">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <div class="title" aria-live="polite">
        <strong id="hole-num">Hole 1</strong><span id="hole-par"></span><span id="hole-hcp" class="hcp"></span>
      </div>
      <button id="next" class="icon" aria-label="Next hole">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
      </button>
      <button id="tee-chip" class="chip" aria-label="Tee set">Back</button>
      <button id="menu" class="icon" aria-label="Menu">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></svg>
      </button>
    </header>

    <button id="score-bug" class="score-bug" aria-label="Scorecard" hidden></button>

    <div id="card" class="card" role="button" tabindex="0" aria-label="Hole details"></div>

    <div id="clubs" class="clubs" hidden>
      <div id="club-track" class="track" role="listbox" aria-label="Club"></div>
    </div>

    <nav class="cams" aria-label="Camera">
      <button id="gps" aria-label="Use my location">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /></svg>
      </button>
      <button data-cam="tee" aria-label="Tee view">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2" class="solid" /><path d="M12 8v7M8 21l4-6 4 6M7.5 11.5l9-2" /></svg>
      </button>
      <button data-cam="top" aria-label="Overhead view">
        <svg viewBox="0 0 24 24"><path d="M3.5 6.5l5.5-2.5 6 2.5 5.5-2.5v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20" /></svg>
      </button>
      <button data-cam="green" aria-label="Green view">
        <svg viewBox="0 0 24 24"><path d="M7 21V3.5l10 3.8-10 3.8" /><ellipse cx="9" cy="20.5" rx="6" ry="1.5" /></svg>
      </button>
    </nav>

    <button id="credits" class="credits">© OpenStreetMap contributors · ⓘ</button>
    <div id="toast" class="toast"></div>
    <div id="status" class="status">Loading…</div>

    <div id="sheet-backdrop" class="backdrop" hidden>
      <section id="sheet" class="sheet" role="dialog" aria-modal="true">
        <div class="grabber"></div>
        <div id="sheet-body"></div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
