<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16241a" />
    <title>Golf Fly · course preview</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%238cc263'/><path d='M14 6v20' stroke='white' stroke-width='2'/><path d='M14 6l9 4-9 4z' fill='%23e23b3b'/></svg>"
    />
  </head>
  <body>
    <div id="view"></div>

    <header class="bar">
      <select id="course" aria-label="Course"></select>
      <div class="holes">
        <button id="prev" aria-label="Previous hole">‹</button>
        <span id="hole-name">Hole 1</span>
        <button id="next" aria-label="Next hole">›</button>
      </div>
      <select id="teeset" aria-label="Tee set"></select>
    </header>

    <aside id="card" class="card"></aside>

    <footer class="controls">
      <div class="buttons">
        <button data-cam="tee">Tee view</button>
        <button data-cam="top">Top-down</button>
        <button data-cam="green">Green view</button>
        <button data-cam="fly">Fly the hole</button>
        <button data-cam="reset">Reset</button>
      </div>
      <label class="exag">
        Vertical <input id="exag" type="range" min="1" max="3" step="0.25" value="2" />
        <span id="exag-value">2x</span>
      </label>
      <p id="credits" class="credits"></p>
    </footer>

    <div id="status" class="status">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
